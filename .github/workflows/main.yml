name: Build Drift Handling Editor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Compile with cl.exe
      shell: cmd
      run: |
        for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set VS=%%i
        call "%VS%\VC\Auxiliary\Build\vcvars32.bat"
        cl.exe /nologo /MT /LD /O2 /W3 ^
          /D WIN32 /D _WINDOWS ^
          drift_handling_editor.cpp ^
          /Fe:drift_handling_editor.asi ^
          /link kernel32.lib user32.lib gdi32.lib ^
          /SUBSYSTEM:WINDOWS /MACHINE:X86

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: drift_handling_editor
        path: drift_handling_editor.asi
