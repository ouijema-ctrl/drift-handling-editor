name: Build Drift Handling Editor

on:
  push:
    branches: [ main ]
  release:
    types: [ created ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Compile ASI
      shell: cmd
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
        cl.exe /nologo /W3 /O2 /MT /LD ^
          /D WIN32 /D _WINDOWS /D NDEBUG ^
          drift_handling_editor.cpp ^
          /Fe:drift_handling_editor.asi ^
          /link kernel32.lib user32.lib gdi32.lib ^
          /SUBSYSTEM:WINDOWS /MACHINE:X86

    - name: Upload ASI artifact
      uses: actions/upload-artifact@v4
      with:
        name: drift_handling_editor
        path: drift_handling_editor.asi

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v2
      with:
        files: drift_handling_editor.asi
